services:
  backend:
    build: ./backend/practicecodesignal
    ports:
      - "8080:8080"
    env_file:
      - .env

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
    env_file:
      - .env